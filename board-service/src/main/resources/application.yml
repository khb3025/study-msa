server:
    port: 8081
    
spring:
    datasource:
        url: jdbc:mysql://localhost:3321/board-db
        username: root
        password: password
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true

    kafka:
        bootstrap-servers: localhost:9092
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer
            # properties:
            #     patitioner.class: org.apache.kafka.clients.producer.RoundRobinPartitioner

    application:
        name: board-service

client:
    user-service:
        url: http://localhost:8080
    point-service:
        url: http://localhost:8082